# Prescriptive span tables used by the estimator.
#
# Source: AWC DCA6 "Prescriptive Residential Wood Deck Construction Guide"
# (40 psf live + 10 psf dead, wet service, No. 2 grade, L/360 deflection).
#
# VERIFY every value against the DCA6 edition your jurisdiction adopts before relying on
# estimates for permitting. Spans are written as "feet-inches".
#
# Species groups:
#   southern_pine      — Southern Pine
#   douglas_fir_larch  — Douglas Fir-Larch, Hem-Fir, Spruce-Pine-Fir (DCA6 lumps these together)
#   hem_fir            — alias of douglas_fir_larch (see above)

# Maximum joist span, by joist spacing on center: [12", 16", 24"]
[joists.southern_pine]
"2x6"  = ["9-11", "9-0",  "7-7"]
"2x8"  = ["13-1", "11-10", "9-8"]
"2x10" = ["16-2", "14-0", "11-5"]
"2x12" = ["18-0", "16-6", "13-6"]

[joists.douglas_fir_larch]
"2x6"  = ["9-6",  "8-8",  "7-2"]
"2x8"  = ["12-6", "11-1", "9-1"]
"2x10" = ["15-8", "13-7", "11-1"]
"2x12" = ["18-0", "15-9", "12-10"]

# Maximum beam span (between posts), by the joist span the beam supports.
[beams]
joist_spans_ft = [6, 8, 10, 12, 14, 16, 18]

[beams.southern_pine]
"2-2x6"  = ["6-11", "5-11", "5-4",  "4-10", "4-6",  "4-3",  "4-0"]
"2-2x8"  = ["8-9",  "7-7",  "6-9",  "6-2",  "5-9",  "5-4",  "5-0"]
"2-2x10" = ["10-4", "9-0",  "8-0",  "7-4",  "6-9",  "6-4",  "6-0"]
"2-2x12" = ["12-2", "10-7", "9-5",  "8-7",  "8-0",  "7-6",  "7-0"]
"3-2x6"  = ["8-2",  "7-5",  "6-8",  "6-1",  "5-8",  "5-3",  "5-0"]
"3-2x8"  = ["10-10", "9-6", "8-6",  "7-9",  "7-2",  "6-8",  "6-4"]
"3-2x10" = ["13-0", "11-3", "10-0", "9-2",  "8-6",  "7-11", "7-6"]
"3-2x12" = ["15-3", "13-3", "11-10", "10-9", "10-0", "9-4", "8-10"]

[beams.douglas_fir_larch]
"2-2x6"  = ["5-11", "5-1",  "4-7",  "4-2",  "3-10", "3-7",  "3-5"]
"2-2x8"  = ["7-5",  "6-5",  "5-9",  "5-3",  "4-10", "4-7",  "4-4"]
"2-2x10" = ["9-1",  "7-10", "7-0",  "6-5",  "5-11", "5-7",  "5-3"]
"2-2x12" = ["10-7", "9-2",  "8-2",  "7-5",  "6-11", "6-6",  "6-1"]
"3-2x6"  = ["7-4",  "6-5",  "5-9",  "5-3",  "4-10", "4-6",  "4-3"]
"3-2x8"  = ["9-3",  "8-1",  "7-3",  "6-7",  "6-1",  "5-8",  "5-4"]
"3-2x10" = ["11-4", "9-10", "8-9",  "8-0",  "7-5",  "6-11", "6-7"]
"3-2x12" = ["13-2", "11-5", "10-2", "9-4",  "8-7",  "8-1",  "7-7"]

# Maximum post height (inches), underside of beam to top of footing or pier.
# Source: IRC Table R507.4 (2018/2021). DCA6 Table 4 can be stricter for 4x4 posts carrying
# large tributary areas; VERIFY against the code your jurisdiction adopts.
[posts]
"4x4" = 96
"6x6" = 168

# Ledger fastener on-center spacing (inches), by joist span, two rows staggered.
[ledger]
joist_spans_ft = [6, 8, 10, 12, 14, 16, 18]
half_inch_lags     = [30, 23, 18, 15, 13, 11, 10]
# Typical structural ledger screw (FastenMaster LedgerLOK-class) — check the product's ESR.
structural_screws  = [24, 24, 16, 16, 16, 12, 12]
