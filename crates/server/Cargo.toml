[package]
name = "server"
description = "ProDeck REST API server (Axum) that also serves the web client"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "prodeck"
path = "src/main.rs"

[dependencies]
api-types = { path = "../api-types", features = ["openapi"] }
estimator = { path = "../estimator", features = ["openapi"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# rustls + bundled webpki roots only: the default `tls-roots` feature links OpenSSL on Linux,
# which the distroless runtime image does not ship.
firestore = { version = "0.61", default-features = false, features = ["tls-webpki-roots", "auth-default-crypto"] }
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
