[workspace]
resolver = "2"
members = ["crates/estimator", "crates/api-types", "crates/server", "crates/web"]
# The web client only builds for wasm32; check it with `cargo check -p web --target wasm32-unknown-unknown`.
default-members = ["crates/estimator", "crates/api-types", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

# Smaller WASM download for the web client.
[profile.release.package.web]
opt-level = "z"
